name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
# Do not cancel a release while uploading assets; serialize updates to the channel.
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'ptiris/zotero-babeldoc'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm run check
      - run: node --test tests/test_controller.cjs
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check.py
      - name: Build matching version tag
        run: python scripts/build.py --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
      - run: python scripts/release-notes.py
      - name: Publish version assets, then stable update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish.py --repository "$GITHUB_REPOSITORY"
